name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ["durable-memory/**", "**.md"]
  pull_request:
    paths-ignore: ["durable-memory/**", "**.md"]
  workflow_dispatch:
    inputs:
      only:
        description: "Run a single matrix job (or 'all')"
        required: true
        default: "all"
        type: choice
        options: [all, linux-x64, linux-arm64, macos-arm64, macos-x64]

# Squid upstream supports POSIX hosts only (no native Windows port in the
# 7.x series), so the matrix covers Linux and macOS, both architectures.
# Linux builds link dependencies statically and glibc dynamically on Ubuntu
# 22.04 (glibc >= 2.35).
# Pushes to main update the rolling dist branch.
# Pushes to v* tags cut a GitHub Release with verified binaries.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     name: linux-x64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
          - { os: macos-15,         name: macos-arm64 }
          - { os: macos-15-intel,   name: macos-x64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    env:
      ONLY_OK: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || matrix.name == inputs.only }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.ONLY_OK == 'true'
        with:
          persist-credentials: false

      - name: sync squid (squid.lock) and verify vendored sdk header
        if: env.ONLY_OK == 'true'
        run: |
          scripts/sync-squid.sh
          scripts/sync-sdk.sh --verify

      - name: toolchain (linux)
        if: runner.os == 'Linux' && env.ONLY_OK == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: toolchain (macos)
        if: runner.os == 'macOS' && env.ONLY_OK == 'true'
        run: brew install ninja coreutils

      - name: lmscript compiler (npm @lmctl-ai/lmctl, DSL v5)
        if: env.ONLY_OK == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: install and probe the compiler
        if: env.ONLY_OK == 'true'
        shell: bash
        run: |
          npm i -g @lmctl-ai/lmctl@0.2.420
          scripts/select-compiler.sh | tee compiler.txt
          grep -q lmscript compiler.txt || { echo "no v5 compiler available"; exit 1; }

      - name: build and test
        if: env.ONLY_OK == 'true'
        shell: bash
        run: ./test.sh

      - name: package artifact
        if: env.ONLY_OK == 'true'
        shell: bash
        run: |
          mkdir -p dist
          cp build/lmproxy dist/lmproxy-${{ matrix.name }}
          cp LICENSE THIRD_PARTY_NOTICES.md dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.ONLY_OK == 'true'
        with:
          name: lmproxy-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  # Push-and-publish: on every main push (and full manual re-runs) collect
  # the matrix binaries and force-update the rolling `dist` branch, so the
  # latest per-OS executables live at permanent URLs. No approval, no
  # release object; the branch head is always "the latest main build".
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push to the dist branch
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lmproxy-*
          path: ${{ runner.temp }}/bins
          merge-multiple: true

      - name: checksums
        run: (cd "${{ runner.temp }}/bins" && sha256sum lmproxy-* > SHA256SUMS)

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true # the token must land in .git/config for the push
          fetch-depth: 1

      - name: update the dist branch
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin dist && git rev-parse -q --verify FETCH_HEAD; then
            git checkout -B dist FETCH_HEAD
          else
            git checkout --orphan dist
          fi
          git rm -rf . >/dev/null 2>&1 || true
          cp "${{ runner.temp }}/bins"/lmproxy-* "${{ runner.temp }}/bins"/SHA256SUMS .
          cp LICENSE THIRD_PARTY_NOTICES.md . 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "dist branch already up to date"
          else
            git commit -m "dist: lmproxy binaries from ${GITHUB_SHA}"
          fi
          git push --force-with-lease origin dist

  # Release on v* tag push: creates a GitHub Release with the four tested
  # platform binaries, checksums, and license notices.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lmproxy-*
          path: dist
          merge-multiple: true

      - name: tag matches lmproxy --version (lmscript @latest compares them)
        run: |
          chmod +x dist/lmproxy-linux-x64
          got="$(dist/lmproxy-linux-x64 --version)"
          test "$got" = "lmproxy ${GITHUB_REF_NAME#v}" || { echo "::error::tag $GITHUB_REF_NAME but binary says '$got' (bump project VERSION in CMakeLists.txt)"; exit 1; }

      - name: generate binary checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f -name 'lmproxy-*' ! -name '*.sha256' -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: attach binaries to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes dist/*
          fi
